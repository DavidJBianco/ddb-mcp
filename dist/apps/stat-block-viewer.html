<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mysterium Stat Block</title>
  <style>:root {
  color-scheme: light dark;
  font-family: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  --shell: var(--color-background-secondary, #ece9e2);
  --toolbar: var(--color-background-primary, #fff);
  --border: var(--color-border-secondary, #c9c5bb);
  --text: var(--color-text-primary, #211d19);
  --muted: var(--color-text-secondary, #685f56);
  --parchment: #f4ead0;
  --parchment-deep: #e8d8b4;
  --ink: #201a16;
  --red: #7d1f1f;
  --red-dark: #541313;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--shell); color: var(--text); }
button { font: inherit; }
.app-shell { min-height: 100vh; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.toolbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 52px; padding: 8px 10px; background: var(--toolbar); border-bottom: 1px solid var(--border); }
.toolbar-title { min-width: 120px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
.toolbar-controls { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
.toolbar button { min-height: 32px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 6px; background: var(--toolbar); color: var(--text); cursor: pointer; }
.toolbar button:hover:not(:disabled) { filter: brightness(.96); border-color: var(--muted); }
.toolbar button:disabled { opacity: .45; cursor: not-allowed; }
#zoom-level { min-width: 46px; text-align: center; color: var(--muted); font-size: 13px; }
.content { flex: 1; overflow: auto; padding: 20px; }
.status { max-width: 680px; margin: 64px auto; padding: 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--toolbar); text-align: center; }
.status.error { color: #9d2525; }
.candidate-list { display: grid; gap: 10px; max-width: 760px; margin: 0 auto; }
.candidate-list h2 { margin: 0 0 8px; }
.candidate { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--toolbar); }
.candidate p { margin: 4px 0 0; color: var(--muted); }
.candidate button { flex: none; padding: 7px 12px; border: 0; border-radius: 6px; background: var(--red); color: white; cursor: pointer; }
.stat-block { width: min(816px, 100%); margin: 0 auto; padding: 24px 28px 30px; transform-origin: top center; color: var(--ink); background: var(--parchment); background-image: linear-gradient(90deg, transparent, rgba(125,31,31,.035), transparent), repeating-linear-gradient(0deg, transparent 0 7px, rgba(73,48,22,.018) 8px); border: 1px solid #b89a65; border-top: 7px solid var(--red); border-bottom: 7px solid var(--red); box-shadow: 0 4px 18px rgba(38,25,10,.25); }
.stat-header { border-bottom: 3px solid var(--red); padding-bottom: 10px; margin-bottom: 12px; }
.stat-header h1 { margin: 0; color: var(--red-dark); font: 700 34px/1.05 Georgia, "Times New Roman", serif; letter-spacing: .01em; }
.classification { margin: 5px 0 0; font: italic 15px/1.35 Georgia, "Times New Roman", serif; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.badge { display: inline-flex; padding: 3px 7px; border: 1px solid #9f7949; border-radius: 999px; background: var(--parchment-deep); font: 700 11px/1.2 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .04em; }
.attributes { display: grid; gap: 3px; margin: 12px 0; }
.attribute { line-height: 1.35; }
.attribute strong { color: var(--red-dark); }
.abilities { width: 100%; margin: 14px 0; border-collapse: collapse; text-align: center; }
.abilities th { color: var(--red-dark); font-size: 12px; }
.abilities td { padding: 4px 3px; border-top: 1px solid rgba(125,31,31,.28); }
.section { break-inside: avoid; margin-top: 18px; }
.section h2 { margin: 0 0 8px; padding-bottom: 3px; color: var(--red-dark); border-bottom: 2px solid var(--red); font: 700 23px/1.1 Georgia, "Times New Roman", serif; }
.entry { margin: 0 0 9px; line-height: 1.42; white-space: pre-wrap; }
.entry-name { font-weight: 750; font-style: italic; }
.source-line { margin-top: 20px; padding-top: 8px; border-top: 1px solid rgba(125,31,31,.35); color: #5e4d3a; font-size: 12px; }
#export-stage { position: fixed; left: -20000px; top: 0; width: 816px; pointer-events: none; }
.export-card { width: 816px; transform: none !important; margin: 0; }
.continuation { color: var(--red-dark); font: 700 18px Georgia, serif; margin-bottom: 10px; }
.toast { position: fixed; right: 16px; bottom: 16px; z-index: 20; padding: 9px 12px; border-radius: 7px; background: #251f1a; color: white; box-shadow: 0 3px 12px #0005; }
.app-shell.fullscreen { position: fixed; inset: 0; z-index: 100; border: 0; border-radius: 0; }
@media (max-width: 700px) {
  .toolbar-title { display: none; }
  .toolbar { justify-content: center; }
  .toolbar-controls { justify-content: center; }
  .content { padding: 10px; }
  .stat-block { padding: 18px 16px 22px; }
  .stat-header h1 { font-size: 28px; }
}
@media print {
  .toolbar { display: none; }
  .content { padding: 0; }
  .stat-block { box-shadow: none; width: 100%; }
}
</style>
</head>
<body>
  <main class="app-shell" id="app-shell">
    <header class="toolbar" aria-label="Stat block controls">
      <div class="toolbar-title" id="toolbar-title">Stat Block</div>
      <div class="toolbar-controls">
        <button id="zoom-out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
        <output id="zoom-level" aria-live="polite">100%</output>
        <button id="zoom-in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
        <button id="copy-text" type="button">Copy text</button>
        <button id="copy-json" type="button">Copy JSON</button>
        <button id="copy-image" type="button">Copy image</button>
        <button id="download-png" type="button">Download PNG</button>
        <button id="open-source" type="button">Open D&amp;D Beyond</button>
        <button id="fullscreen" type="button" title="Fullscreen" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </header>
    <section class="content" id="content">
      <div class="status" id="status" role="status">Loading stat block…</div>
      <div class="candidate-list" id="candidate-list" hidden></div>
      <article class="stat-block" id="stat-block" hidden aria-labelledby="creature-name"></article>
    </section>
  </main>
  <div id="export-stage" aria-hidden="true"></div>
