name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    name: Release PR Source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the release source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Release PRs to main must come from dev; got: $HEAD_REF" >&2
            exit 1
          fi

  ci:
    name: Type Check, Lint, Build & Offline Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/mysterium-auth/go.mod
          cache-dependency-path: cmd/mysterium-auth/go.sum

      - name: Install locked dependencies
        run: make deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Offline tests
        run: make test

      - name: Verify generated output is current
        run: git diff --exit-code -- dist/

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Audit dependencies (production only)
        run: make audit

  auth-helper:
    name: Host Auth Helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/mysterium-auth/go.mod
          cache-dependency-path: cmd/mysterium-auth/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify formatting
        shell: bash
        run: |
          gofmt -w cmd/mysterium-auth
          git diff --exit-code -- cmd/mysterium-auth

      - name: Install Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress --yes

      - name: Test and vet
        run: make test-helper

      - name: Build
        run: make helper

  auth-helper-cross-build:
    name: Host Auth Helper Cross Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/mysterium-auth/go.mod
          cache-dependency-path: cmd/mysterium-auth/go.sum

      - name: Cross-compile release targets
        working-directory: cmd/mysterium-auth
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /tmp/mysterium-auth-${target//\//-} ./
          done

  docker:
    name: Docker MCP & Browser (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: mysterium:ci-amd64
            cache: amd64
            test-script: test:docker:run
          - platform: linux/arm64
            tag: mysterium:ci-arm64
            cache: arm64
            test-script: test:docker:architecture

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=docker-${{ matrix.cache }}
          cache-to: type=gha,scope=docker-${{ matrix.cache }},mode=max

      - name: Exercise candidate image
        run: >-
          make test-docker
          BUILD_DOCKER_IMAGE=0
          TEST_IMAGE=${{ matrix.tag }}
          DOCKER_TEST_SCRIPT=${{ matrix.test-script }}
