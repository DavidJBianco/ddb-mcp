name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    name: Release PR Source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the release source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Release PRs to main must come from dev; got: $HEAD_REF" >&2
            exit 1
          fi

  ci:
    name: Type Check, Lint, Build & Offline Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm run test:offline

      - name: Verify generated output is current
        run: git diff --exit-code -- dist/

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (production only)
        run: npm audit --audit-level=high --omit=dev

  auth-helper:
    name: Host Auth Helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        working-directory: cmd/ddb-mcp-auth

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/ddb-mcp-auth/go.mod
          cache-dependency-path: cmd/ddb-mcp-auth/go.sum

      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

  auth-helper-cross-build:
    name: Host Auth Helper Cross Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: cmd/ddb-mcp-auth/go.mod
          cache-dependency-path: cmd/ddb-mcp-auth/go.sum

      - name: Cross-compile release targets
        working-directory: cmd/ddb-mcp-auth
        run: |
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /tmp/ddb-mcp-auth-${target//\//-} ./
          done

  docker:
    name: Docker MCP & Browser (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            tag: ddb-mcp:ci-amd64
            cache: amd64
            test-script: test:docker:run
          - platform: linux/arm64
            tag: ddb-mcp:ci-arm64
            cache: arm64
            test-script: test:docker:architecture

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install MCP test client dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=docker-${{ matrix.cache }}
          cache-to: type=gha,scope=docker-${{ matrix.cache }},mode=max

      - name: Exercise candidate image
        env:
          DDB_MCP_TEST_IMAGE: ${{ matrix.tag }}
        run: npm run ${{ matrix.test-script }}
