name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-source:
    name: Release PR Source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the release source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "dev" ]; then
            echo "Release PRs to main must come from dev; got: $HEAD_REF" >&2
            exit 1
          fi

  ci:
    name: Type Check, Lint, Build & Offline Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Offline tests
        run: npm run test:offline

      - name: Verify generated output is current
        run: git diff --exit-code -- dist/

  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (production only)
        run: npm audit --audit-level=high --omit=dev

  docker:
    name: Docker Build & Offline Browser Smoke Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ddb-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Exercise MCP and headed Chromium inside the image
        env:
          DDB_MCP_TEST_IMAGE: ddb-mcp:ci
        run: npm run test:docker:run
